spring:
  application:
    name: patient-engagement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engagement}
    username: ${DB_USER:engagement}
    password: ${DB_PASSWORD:engagement}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks the mapping against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

logging:
  level:
    # Never log SQL parameters: they would carry patient data.
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
